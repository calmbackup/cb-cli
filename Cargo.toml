[package]
name = "calmbackup"
version = "2.0.12"
edition = "2024"
description = "Zero-knowledge encrypted database backups"
license = "MIT"

[[bin]]
name = "calmbackup"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# TUI
ratatui = "0.29"
crossterm = "0.28"

# Async
tokio = { version = "1", features = ["full"] }

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio-util = { version = "0.7", features = ["io"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Database (bundled SQLite: static, no external `sqlite3` binary dependency at
# runtime; `backup` enables the online backup API for consistent live dumps)
rusqlite = { version = "0.32", features = ["bundled", "backup"] }

# Crypto
# EVP provides incremental GCM without changing the existing archive format.
# Vendored OpenSSL keeps the Linux musl releases self-contained.
openssl = { version = "0.10", features = ["vendored"] }
sha2 = "0.10"
rand = "0.8"
hex = "0.4"

# Archive
tar = "0.4"
flate2 = "0.2"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Misc
dirs = "6"
fs2 = "0.4"
semver = "1"
tempfile = "3"

[dev-dependencies]
# Independent oracle for compatibility with the previous Rust/Go archive format.
aes-gcm = "0.10"

[profile.release]
opt-level = 3
lto = true
strip = true
