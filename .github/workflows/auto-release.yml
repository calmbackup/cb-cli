name: Auto Release

on:
  push:
    branches:
      - master
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - 'docs/**'

# Needed by the publish job to create the GitHub Release.
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test

  release:
    needs: test
    runs-on: ubuntu-latest

    # Expose the bumped version/tag to the build + publish jobs below.
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      new_tag: ${{ steps.bump.outputs.new_tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Get latest tag
        id: latest_tag
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Bump patch version
        id: bump
        run: |
          TAG="${{ steps.latest_tag.outputs.tag }}"
          VERSION="${TAG#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
          NEW_TAG="v${NEW_VERSION}"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "Bumping $TAG → $NEW_TAG"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Update Cargo.toml and Cargo.lock version
        run: |
          NEW_VERSION="${{ steps.bump.outputs.new_version }}"
          sed -i "0,/^version = \".*\"/s//version = \"${NEW_VERSION}\"/" Cargo.toml
          cargo update -p calmbackup --precise "${NEW_VERSION}"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }} [skip ci]"
          git push origin HEAD:master

      - name: Create and push tag
        run: |
          git tag "${{ steps.bump.outputs.new_tag }}"
          git push origin "${{ steps.bump.outputs.new_tag }}"

  # Build release binaries for the freshly-created tag. Merged into this
  # workflow (rather than a separate tag-triggered one) because a tag pushed by
  # a workflow does not reliably trigger another workflow — which left v2.0.6/7
  # tagged but never built.
  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            name: linux_amd64
          - target: aarch64-unknown-linux-musl
            name: linux_arm64

    runs-on: ubuntu-latest
    # arm64 cross-builds are best-effort; a failure there must not block the
    # amd64 release that the production fleet installs.
    continue-on-error: ${{ matrix.target == 'aarch64-unknown-linux-musl' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.new_tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install cross (for arm64)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package
        run: |
          VERSION="${{ needs.release.outputs.new_version }}"
          TARBALL="calmbackup_${VERSION}_${{ matrix.name }}.tar.gz"
          tar -czf "${TARBALL}" -C target/${{ matrix.target }}/release calmbackup
          echo "TARBALL=${TARBALL}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.TARBALL }}

  publish:
    needs: [release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.new_tag }}
          files: "*.tar.gz"
          generate_release_notes: true

      - name: Notify LogBlazer
        continue-on-error: true
        env:
          LOGBLAZER_KEY: ${{ secrets.LOGBLAZER_KEY }}
        run: |
          [ -z "$LOGBLAZER_KEY" ] && exit 0
          curl -s -X POST "https://app.logblazer.com/api/logs/${LOGBLAZER_KEY}" \
            -d "payload=CLI ${{ needs.release.outputs.new_tag }} published" \
            -d "status=SUCCESS" \
            -d "source=github-release" \
            -d "monitor_title=Latest CLI Version" \
            -d "monitor_type=text" \
            -d "monitor_value=${{ needs.release.outputs.new_tag }}"
